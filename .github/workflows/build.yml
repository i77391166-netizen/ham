name: build apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html из корня
        run: |
          if [ -f index.html ] && [ ! -s app/src/main/assets/index.html ]; then
            mkdir -p app/src/main/assets
            cp index.html app/src/main/assets/index.html
          fi
          ls -l app/src/main/assets/

      - name: Проверка JS
        continue-on-error: true
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('app/src/main/assets/index.html','utf8');const m=[...h.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];let n=0;for(const x of m){try{new Function(x[1]);n++}catch(e){console.error('JS ERROR:',e.message);process.exitCode=1}}console.log('скриптов проверено:',n)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Size
        run: ls -lh app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: ham-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Хам v${{ github.run_number }}
          body: Сборка APK. Скачай файл ниже и установи.
          files: app/build/outputs/apk/debug/*.apk
